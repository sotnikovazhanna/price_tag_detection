<!DOCTYPE html>
<html>
<head>
    <title>PriceTag Metrics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial; margin: 20px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .metric-card { border: 1px solid #ddd; padding: 20px; border-radius: 10px; text-align: center; }
        .metric-value { font-size: 48px; font-weight: bold; margin: 10px 0; }
        .good { color: #28a745; }
        .medium { color: #ffc107; }
        .bad { color: #dc3545; }
        canvas { max-height: 200px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1> PriceTag Metrics Dashboard</h1>

    <div class="metrics-grid">
        <div class="metric-card">
            <h3> F1-Score</h3>
            <div class="metric-value" id="f1">0%</div>
            <canvas id="f1-chart"></canvas>
        </div>
        <div class="metric-card">
            <h3> Precision</h3>
            <div class="metric-value" id="precision">0%</div>
            <canvas id="precision-chart"></canvas>
        </div>
        <div class="metric-card">
            <h3> Recall</h3>
            <div class="metric-value" id="recall">0%</div>
            <canvas id="recall-chart"></canvas>
        </div>
    </div>

    <script>
        async function loadMetrics() {
            try {
                const response = await fetch('/api/metrics');
                const data = await response.json();

                if (data.detection) {
                    document.getElementById('f1').textContent = `${(data.detection.f1_score * 100).toFixed(1)}%`;
                    document.getElementById('precision').textContent = `${(data.detection.precision * 100).toFixed(1)}%`;
                    document.getElementById('recall').textContent = `${(data.detection.recall * 100).toFixed(1)}%`;

                    const f1 = data.detection.f1_score;
                    document.getElementById('f1').className = f1 > 0.8 ? 'metric-value good' : (f1 > 0.6 ? 'metric-value medium' : 'metric-value bad');
                }
            } catch(e) { console.error(e); }
        }

        loadMetrics();
        setInterval(loadMetrics, 10000);
    </script>
</body>
</html>
