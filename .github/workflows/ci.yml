name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8 (проверка стиля кода)
      run: |
        pip install flake8
        flake8 app/ --count --show-source --statistics

    - name: Build Docker image
      run: docker build -t price-tag-detection .

    - name: Run container
      run: docker run -d -p 8000:8000 price-tag-detection

    - name: Test server response
      run: sleep 10 && curl -f http://localhost:8000