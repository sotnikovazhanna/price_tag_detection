name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and API tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint application
        run: python -m flake8 app --count --show-source --statistics --max-line-length=120

      - name: Run API tests
        run: python -m pytest -q

  container-smoke-test:
    name: Build and smoke-test container
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag price-tag-detection:${{ github.sha }} .

      - name: Start container
        run: docker run --detach --name price-tag-detection --publish 8000:8000 price-tag-detection:${{ github.sha }}

      - name: Wait for service and verify health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Service did not become ready in 60 seconds" >&2
          exit 1

      - name: Print container logs on failure
        if: failure()
        run: docker logs price-tag-detection

      - name: Remove test container
        if: always()
        run: docker rm --force price-tag-detection
